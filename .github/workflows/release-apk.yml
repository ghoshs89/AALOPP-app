name: Release APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Load publisher key if configured
        env:
          KEY: ${{ secrets.PUZZLE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEY" ]]; then
            umask 077
            printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/publisher.p12"
            echo "PUZZLE_KEYSTORE=$RUNNER_TEMP/publisher.p12" >> "$GITHUB_ENV"
          fi
      - name: Build release
        env:
          PUZZLE_KEY_PASSWORD: ${{ secrets.PUZZLE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-for-verification
          path: app/build/outputs/apk/release/*.apk
      - name: Publish verified signed tag
        if: startsWith(github.ref, 'refs/tags/v') && env.PUZZLE_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          apk="app/build/outputs/apk/release/app-release.apk"
          scripts/verify-release.sh "$apk" "$tag"
          cp "$apk" "PuzzleQuest-$tag.apk"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "PuzzleQuest-$tag.apk" --verify-tag --generate-notes
          fi
