name: Release APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signed_blob:
        description: "Optional Git blob SHA of an offline-signed APK"
        required: false
      release_tag:
        description: "Existing version tag for the offline-signed APK"
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Load publisher key if configured
        if: inputs.signed_blob == ''
        env:
          KEY: ${{ secrets.PUZZLE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEY" ]]; then
            umask 077
            printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/publisher.p12"
            echo "PUZZLE_KEYSTORE=$RUNNER_TEMP/publisher.p12" >> "$GITHUB_ENV"
          fi
      - name: Run unit tests
        if: inputs.signed_blob == ''
        run: gradle :app:testDebugUnitTest
      - name: Build release
        if: inputs.signed_blob == ''
        env:
          PUZZLE_KEY_PASSWORD: ${{ secrets.PUZZLE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Retrieve offline-signed APK
        if: inputs.signed_blob != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB: ${{ inputs.signed_blob }}
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TAG" == "v$(cat version.txt)" ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$TAG^{commit}")" ]]
          mkdir -p app/build/outputs/apk/release
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$BLOB" --jq .content | base64 -d > app/build/outputs/apk/release/app-release.apk
          scripts/verify-release.sh app/build/outputs/apk/release/app-release.apk "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-for-verification
          path: app/build/outputs/apk/release/*.apk
      - name: Publish verified signed tag
        if: (startsWith(github.ref, 'refs/tags/v') && env.PUZZLE_KEYSTORE != '') || inputs.signed_blob != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          apk="app/build/outputs/apk/release/app-release.apk"
          scripts/verify-release.sh "$apk" "$tag"
          cp "$apk" "PuzzleQuest-$tag.apk"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "PuzzleQuest-$tag.apk" --verify-tag --generate-notes
          fi
